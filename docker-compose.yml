services:
  # 1. Cơ sở dữ liệu chính (PostgreSQL 16 có extension pgvector cho RAG AI)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lurnkode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lurnkode_user
      POSTGRES_PASSWORD: lurnkode_password
      POSTGRES_DB: lurnkode_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lurnkode_user -d lurnkode_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lurnkode-network

  # 2. Redis phục vụ Hàng đợi chấm code Sandbox (BullMQ) & Caching
  redis:
    image: redis:7-alpine
    container_name: lurnkode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lurnkode-network

  # 3. Phân hệ Backend API (M1 Auth & Identity, M2 Learning Management)
  api:
    container_name: lurnkode-api
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lurnkode_user:lurnkode_password@postgres:5432/lurnkode_db
      PORT: 8000
      NODE_ENV: production
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      INTERNAL_SERVICE_KEY: lurnkode_internal_secret_key_m4
      JWT_PRIVATE_KEY_BASE64: 
      JWT_PUBLIC_KEY_BASE64: 
      JWT_KEY_ID: m1-auth-key-v1
      JWT_ISSUER: https://lurnkode.local/m1
      JWT_AUDIENCE: lurnkode-api
      JWT_ACCESS_TOKEN_TTL: 900
      JWT_REFRESH_TOKEN_TTL: 604800
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lurnkode-network

  # 4. Phân hệ Frontend Web UI (M5 - Next.js)
  ui:
    container_name: lurnkode-ui
    build:
      context: ./apps/web/lurnkode-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    # Ánh xạ 3001:3000 để tránh xung đột nếu cổng 3000 đang được dùng bởi container khác trên máy
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - lurnkode-network

networks:
  lurnkode-network:
    name: lurnkode-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
